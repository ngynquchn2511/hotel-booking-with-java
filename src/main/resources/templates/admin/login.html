<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cổng quản trị | Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: radial-gradient(circle at top right, #304c70, #101c2b 58%); }
        .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .login-card { width: min(100%, 450px); border: 1px solid rgba(255,255,255,.1); border-radius: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
        .badge-icon { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 18px; background: #e9b44c; color: #172536; font-size: 25px; margin: 0 auto 1rem; }
        .form-control { border-radius: 12px; padding: .78rem .9rem; }.btn-admin { border-radius: 12px; padding: .8rem; font-weight: 700; }
    </style>
</head>
<body>
<main class="login-shell">
    <section class="card login-card bg-white"><div class="card-body p-4 p-md-5">
        <div class="text-center mb-4"><div class="badge-icon">⌘</div><div class="text-uppercase text-warning-emphasis fw-bold small" style="letter-spacing:.14em">Hotel Booking</div><h1 class="h3 fw-bold mt-2 mb-1">Cổng quản trị</h1><p class="text-secondary mb-0">Dành cho nhân viên và quản trị viên.</p></div>
        <div th:if="${param.error}" class="alert alert-danger border-0 rounded-3 small">Email hoặc mật khẩu không đúng.</div>
        <div th:if="${param.error != null and param.error[0] == 'wrong_portal'}" class="alert alert-danger border-0 rounded-3 small">Tài khoản không có quyền truy cập khu vực quản trị.</div>
        <div th:if="${param.logout}" class="alert alert-success border-0 rounded-3 small">Bạn đã đăng xuất thành công.</div>
        <form th:action="@{/admin/login}" method="post">
            <div class="mb-3"><label for="admin-email" class="form-label fw-semibold small">Email công việc</label><input id="admin-email" type="email" name="username" class="form-control" placeholder="name@hotel.com" autocomplete="email" required autofocus></div>
            <div class="mb-4"><label for="admin-password" class="form-label fw-semibold small">Mật khẩu</label><input id="admin-password" type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" autocomplete="current-password" required></div>
            <button type="submit" class="btn btn-dark btn-admin w-100">Đăng nhập quản trị</button>
        </form>
        <p class="text-center mt-4 mb-0 small"><a th:href="@{/login}" class="text-decoration-none">← Quay lại đăng nhập khách hàng</a></p>
    </div></section>
</main>
</body>
</html>
