<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử đặt phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body th:style="'background-color: #f8f9fa; background-image: url(' + @{/page-images/lichsudatphong.jpg} + '); background-size: cover; background-position: center; background-attachment: fixed; background-repeat: no-repeat; min-height: 100vh; display: flex; flex-direction: column;'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <h3 class="fw-bold mb-4">Lịch sử đặt phòng</h3>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">
        Bạn chưa có đơn đặt phòng nào.
        <a th:href="@{/customer/rooms}">Tìm phòng ngay</a>
    </div>

    <div class="bg-white rounded shadow-sm" th:if="${not #lists.isEmpty(bookings)}">
        <table class="table table-striped align-middle mb-0" style="--bs-table-striped-bg: #eaf6ff;">
            <thead>
            <tr>
                <th>Mã đơn</th>
                <th>Phòng</th>
                <th>Ngày nhận</th>
                <th>Ngày trả</th>
                <th>Combo</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td th:text="'#' + ${b.id}"></td>
                <td th:text="'Phòng ' + ${b.room.roomNumber}"></td>
                <td th:text="${b.checkInDate} + ' ' + ${b.checkInTime}"></td>
                <td th:text="${b.checkOutDate} + ' ' + ${b.checkOutTime}"></td>
                <td th:text="${b.combo != null} ? ${b.combo.name} : '-'"></td>
                <td th:text="${#numbers.formatDecimal(b.totalAmount, 1, 0)} + 'VND'"></td>
                <td><span class="badge bg-secondary" th:text="${b.status.vietnameseLabel}"></span></td>
                <td>
                    <a th:href="@{/customer/bookings/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/pagination :: pagination('/customer/bookings', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
    </div>
</main>

<div th:replace="~{fragments/chatbot-widget :: widget}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
