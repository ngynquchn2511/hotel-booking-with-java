<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lịch sử đặt phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/eaut-theme.css}" rel="stylesheet">
</head>
<body class="eaut" th:style="'--page-bg: url(' + @{/page-images/lichsudatphong.jpg} + ')'">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">
    <div class="eaut-head">
        <div class="eyebrow">Tài khoản của bạn</div>
        <h1>Lịch sử <span class="gradient-text">đặt phòng</span></h1>
        <div class="divider"></div>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div th:if="${#lists.isEmpty(bookings)}" class="alert alert-info">
        Bạn chưa có đơn đặt phòng nào.
        <a th:href="@{/customer/rooms}">Tìm phòng ngay</a>
    </div>

    <div class="bg-white rounded shadow-sm p-2 p-md-3 table-responsive" th:if="${not #lists.isEmpty(bookings)}">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Mã đơn</th>
                <th>Phòng</th>
                <th>Ngày nhận</th>
                <th>Ngày trả</th>
                <th>Combo</th>
                <th>Tổng tiền</th>
                <th>Trạng thái</th>
                <th>Thanh toán</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${bookings}">
                <td class="fw-bold" style="color: var(--blue-dark)" th:text="'#' + ${b.id}"></td>
                <td th:text="'Phòng ' + ${b.room.roomNumber}"></td>
                <td th:text="${b.checkInDate} + ' ' + ${b.checkInTime}"></td>
                <td th:text="${b.checkOutDate} + ' ' + ${b.checkOutTime}"></td>
                <td th:text="${b.combo != null} ? ${b.combo.name} : '-'"></td>
                <td th:text="${#numbers.formatDecimal(b.totalAmount, 1, 0)} + 'VND'"></td>
                <td><span th:class="'badge ' + ${b.status.badgeClass}" th:text="${b.status.vietnameseLabel}"></span></td>
                <td th:with="pay=${payments[b.id]}">
                    <span th:if="${pay != null and pay.status.name() == 'PAID'}" class="badge bg-success"
                          th:text="${pay.paymentMethod.vietnameseLabel}"></span>
                    <span th:unless="${pay != null and pay.status.name() == 'PAID'}" class="text-muted small">Chưa thanh toán</span>
                </td>
                <td class="text-nowrap">
                    <a th:href="@{/customer/bookings/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                    <a th:if="${payments[b.id] != null and payments[b.id].status.name() == 'PAID'}" target="_blank"
                       th:href="@{/customer/bookings/{id}/invoice(id=${b.id})}" class="btn btn-sm btn-outline-success">Hóa đơn</a>
                    <a th:if="${b.status.name() == 'CHECKED_OUT' and reviews[b.id] == null}"
                       th:href="@{/customer/bookings/{id}(id=${b.id})} + '#danh-gia'" class="btn btn-sm btn-primary"><i class="bi bi-star me-1"></i>Đánh giá</a>
                    <span th:if="${reviews[b.id] != null}" class="badge bg-warning" th:text="${reviews[b.id].rating} + ' ★'"></span>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:replace="~{fragments/pagination :: pagination('/customer/bookings', ${currentPage}, ${totalPages}, ${pageNumbers}, null, null)}"></div>
    </div>
</main>

<div th:replace="~{fragments/chatbot-widget :: widget}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
