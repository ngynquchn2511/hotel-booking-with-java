<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Không tìm thấy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column;">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="p-5 bg-white rounded shadow-sm text-center" style="max-width: 560px;">
        <h1 class="fw-bold mb-3">Không tìm thấy nội dung</h1>
        <p class="text-muted mb-4" th:text="${errorMessage}">Nội dung bạn tìm không tồn tại hoặc đã bị thay đổi.</p>
        <a th:href="@{/}" class="btn btn-primary">Về trang chủ</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
