<footer th:fragment="footer" class="bg-dark text-white-50 mt-5">
    <div class="container py-4">
        <div class="row gy-3 align-items-center">
            <div class="col-md-4">
                <span class="fw-bold text-white fs-5">Hotel Booking</span>
                <p class="small mb-0 mt-1">Đặt phòng khách sạn trực tuyến nhanh chóng, tiện lợi.</p>
            </div>
            <div class="col-md-4 text-md-center">
                <ul class="list-inline mb-0 small">
                    <li class="list-inline-item mx-2">
                        <a th:href="@{/}" class="link-light link-opacity-75 link-opacity-100-hover text-decoration-none">Trang chủ</a>
                    </li>
                    <li class="list-inline-item mx-2">
                        <a th:href="@{/rooms}" class="link-light link-opacity-75 link-opacity-100-hover text-decoration-none">Danh sách phòng</a>
                    </li>
                    <li class="list-inline-item mx-2" sec:authorize="hasRole('CUSTOMER')">
                        <a th:href="@{/customer/bookings}" class="link-light link-opacity-75 link-opacity-100-hover text-decoration-none">Lịch sử đặt phòng</a>
                    </li>
                </ul>
            </div>
            <div class="col-md-4 text-md-end">
                <span class="small">&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Booking-Hotel. All Rights Reserved.</span>
            </div>
        </div>
    </div>
</footer>
