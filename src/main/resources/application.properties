spring.application.name=hotel-booking

# Database - doi lai username/password cho phu hop voi may cua ban
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_booking?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Upload anh (phong, combo...)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
app.upload.base-dir=uploads

# Thu muc chua anh nen cho tung trang (nam ngoai project, ban tu them anh vao day)
app.page-images.dir=D:/CongNgheJava/img

# Server
server.port=8080

# Hien chi tiet loi tren trinh duyet de de debug (chi dung trong qua trinh phat trien)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always

# Locale mac dinh tieng Viet - anh huong den cach #numbers.formatDecimal() hien dau phan cach hang nghin (dung dau cham)
spring.mvc.locale=vi_VN
spring.mvc.locale-resolver=fixed

# Cau hinh gui email xac nhan dat phong (Gmail SMTP)
# Dat bien moi truong MAIL_USERNAME va MAIL_PASSWORD truoc khi chay ung dung.
# MAIL_PASSWORD phai la Gmail App Password 16 ky tu, khong phai mat khau Gmail thuong.
# Vi du PowerShell: $env:MAIL_USERNAME="your@gmail.com"; $env:MAIL_PASSWORD="xxxx xxxx xxxx xxxx"
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
